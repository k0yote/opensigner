# Serves the prerendered documentation.
#
# The site is built with renderStrategy: 'full-static', so every route already
# exists as HTML on disk and needs nothing but a file server. Running the
# framework's own preview server instead would put a Node runtime and the whole
# build dependency tree in the image to re-render pages that are already rendered.
server {
    listen 4173;
    # Also bind IPv6: inside the container `localhost` resolves to ::1 first, so an
    # IPv4-only socket makes the healthcheck fail against a server that is
    # otherwise serving correctly.
    listen [::]:4173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Documentation is meant to be linked and embedded in search results, so
    # framing is restricted rather than denied outright.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Hashed asset filenames change whenever content changes, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Plain-text renderings for agents, and the crawler entry points. Short cache
    # so a docs deploy is picked up promptly.
    location ~ ^/(llms\.txt|llms-full\.txt|sitemap\.xml|robots\.txt|health\.json)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Vocs emits each route as <route>/index.html. Trying $uri.html as well keeps
    # extension-less URLs working regardless of which shape the build produced.
    location / {
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
